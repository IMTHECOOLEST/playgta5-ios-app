name: Build PlayGTA5 iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check source files
        run: |
          set -e
          for file in \
            ContentView.swift \
            GameWebView.swift \
            PlayGTA5WrapperApp.swift \
            TouchControlsView.swift
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required source file: $file"
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: PlayGTA5Wrapper
          options:
            bundleIdPrefix: com.playgta5
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "2"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
              CODE_SIGNING_ALLOWED: "NO"
          targets:
            PlayGTA5Wrapper:
              type: application
              platform: iOS
              sources:
                - ContentView.swift
                - GameWebView.swift
                - PlayGTA5WrapperApp.swift
                - TouchControlsView.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.playgta5.wrapper
                  PRODUCT_NAME: PlayGTA5Wrapper
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: PlayGTA5
                  INFOPLIST_KEY_LSRequiresIPhoneOS: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SUPPORTS_MACCATALYST: NO
          EOF

          xcodegen generate
          xcodebuild -list -project PlayGTA5Wrapper.xcodeproj

      - name: Build for iPad
        run: |
          set -o pipefail
          xcodebuild \
            -project PlayGTA5Wrapper.xcodeproj \
            -scheme PlayGTA5Wrapper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/PlayGTA5Wrapper.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::The iOS app was not produced."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -qry ../../PlayGTA5Wrapper-unsigned.ipa Payload
          cd ../..

          test -s PlayGTA5Wrapper-unsigned.ipa
          echo "IPA package created."

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlayGTA5Wrapper-unsigned-IPA
          path: PlayGTA5Wrapper-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PlayGTA5-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
